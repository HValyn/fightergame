; Export presets. Godot fills in any option missing here with its default.
; Before exporting: Editor > Manage Export Templates > Download (4.7.2), and for
; Android set the SDK path + debug keystore in Editor Settings > Export > Android.
; Release signing (keystore passwords) belongs in export_credentials.cfg / env
; vars (GODOT_ANDROID_KEYSTORE_RELEASE_*), never in this file.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*"
export_path="../build/android/fightergame.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.example.fightergame"
package/name="Fightergame"
package/signed=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features="steam"
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*"
export_path="../build/linux/fightergame.x86_64"

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.2]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="steam"
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*"
export_path="../build/windows/fightergame.exe"

[preset.2.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/product_name="Fightergame"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
