# Modern Pakistan roster for the Skeleton2D (cutout) route.
#
#   python tools/rig_art/rig_prompts.py prompts   # -> tools/rig_art/prompts/RIG_PROMPTS.md
#   python tools/rig_art/rig_prompts.py status    # what's in rig_raw/ and what's missing
#
# 4 provinces x (urban, rural) x (male, female) = 16 fighters.
# Each fighter needs only 4 images (reference, parts sheet, far-side parts sheet, portrait);
# the animation comes from the Godot rig, not from generated frames.
#
# Fields
#   moveset   which existing frame-data file this fighter takes over first
#             (godot/data/characters/<moveset>.json), or "" = concept only, moves not designed yet
#   style     fighting style, for move design later (not sent to the image model)
#   look      sent to the image model. Be concrete: garments, colours, materials, hair, shoes.
#   key       chroma background for this fighter. Default magenta; use green for outfits
#             heavy in pink/red/magenta (phulkari, chunri, Swati embroidery, Baloch reds).
#   cloth     loose pieces that must be cut as their own parts (Polygon2D + bone weights / jiggle)
#   props     held or worn objects that get their own bone
#   rig       easy | medium | hard  (how much loose cloth there is). Rig the easy ones first.

[style]
preamble = "2D fighting game character art made for cutout (puppet) animation, hand-painted cel-shaded illustration, bold clean dark outlines, flat even lighting with simple two-tone shading, vivid colours with accents inspired by Pakistani truck art, strong readable silhouette, contemporary Pakistan, grounded and respectful, not a caricature"
rig_pose = "full body from head to feet, strict side view (profile) facing to the RIGHT of the image, neutral rig pose: standing upright, feet a little apart, arms held slightly away from the body with elbows a little bent, hands relaxed, no limb overlapping the torso, no cast shadows, no floor, no text, no watermark, no other characters"
default_key = "#FF00FF"

# One skeleton shared by every fighter (bone names = part names = Godot Bone2D names).
# near_* = the limb closer to the camera, far_* = the one behind the body.
[skeleton]
core = ["head", "chest", "pelvis"]
limbs = ["upper_arm", "forearm", "hand", "thigh", "shin", "foot"]

